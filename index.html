<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manda - Mandarin Correction Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a2e; --red: #e63946; --jade: #2a9d8f; --gold: #e9c46a;
      --cream: #faf9f6; --mist: #f0efeb; --slate: #6b7280; --border: #e5e4e0;
      --font-ui: 'Inter', sans-serif;
      --font-hanzi: 'Noto Serif SC', serif;
    }
    body { font-family: var(--font-ui); background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .app { max-width: 620px; margin: 0 auto; padding: 0 16px 60px; }

    .hero { text-align: center; padding: 32px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .zh { font-family: var(--font-hanzi); font-weight: 400; color: var(--red); margin-left: 8px; font-size: 26px; }
    .hero p { font-size: 14px; color: var(--slate); margin-top: 6px; }
    .badge { display: inline-block; background: var(--mist); color: var(--slate); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
    .badge-green { background: var(--jade); color: #fff; }
    .badge-blue { background: #3b82f6; color: #fff; }

    /* Provider & Key box */
    .config-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .config-section { margin-bottom: 16px; }
    .config-section:last-child { margin-bottom: 0; }
    .config-label { font-size: 11px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; display: block; }
    
    select { width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; font-family: var(--font-ui); outline: none; }
    select:focus { border-color: var(--jade); }

    .key-box-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .key-box-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .key-saved-chip { font-size: 11px; font-weight: 600; color: var(--jade); background: #e6f7f5; padding: 2px 8px; border-radius: 20px; }
    .key-row { display: flex; gap: 8px; }
    .key-row input { flex: 1; padding: 9px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--mist); font-family: monospace; outline: none; color: var(--ink); }
    .key-row input:focus { border-color: var(--jade); background: #fff; }
    .key-row button { padding: 9px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background: var(--ink); color: #fff; flex: 0 0 auto; min-width: 60px; }
    .key-row button.saved { background: var(--jade); }
    .key-row .clear-btn { background: var(--mist); color: var(--slate); border: 1px solid var(--border); }
    
    .provider-note { font-size: 11px; color: var(--slate); margin-top: 8px; line-height: 1.6; }
    .provider-note a { color: var(--jade); text-decoration: none; }
    .provider-note a:hover { text-decoration: underline; }
    .provider-note strong { color: var(--ink); }

    .section { margin-bottom: 20px; }
    .label { font-size: 11px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; display: block; }
    .toggle-row { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .toggle-btn { flex: 1; padding: 10px 0; font-size: 13px; font-weight: 500; border: none; cursor: pointer; background: transparent; color: var(--slate); transition: all 0.15s; }
    .toggle-btn.active { background: var(--ink); color: #fff; }
    .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tab-btn { padding: 8px 20px; font-size: 13px; color: var(--slate); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: var(--red); border-bottom-color: var(--red); font-weight: 600; }
    textarea { width: 100%; min-height: 200px; max-height: 400px; padding: 14px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink); resize: vertical; font-family: var(--font-ui); outline: none; line-height: 1.5; overflow-y: auto; }
    textarea:focus { border-color: var(--jade); }

    .mic-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
    .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border); background: #fff; cursor: pointer; font-size: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .mic-btn.recording { border-color: var(--red); background: #fef2f2; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .mic-status { font-size: 13px; color: var(--slate); text-align: center; }
    .mic-status.err { color: var(--red); }

    .correct-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: all 0.15s; }
    .correct-btn:disabled { background: var(--border); color: var(--slate); cursor: default; }
    .correct-btn:not(:disabled):hover { opacity: 0.88; }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; line-height: 1.5; }
    .loading-box { text-align: center; color: var(--slate); font-size: 14px; padding: 24px 0; }

    .score-card { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 16px; background: var(--cream); border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    .score-overall { font-size: 36px; font-weight: 700; }
    .score-rings { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .ring-label { font-size: 11px; color: var(--slate); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }

    .result-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
    .result-label { font-size: 11px; color: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 600; }
    .result-hanzi { font-family: var(--font-hanzi); font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.7; letter-spacing: 0.1em; }
    .result-pinyin { font-size: 14px; color: var(--jade); margin-top: 6px; font-weight: 500; }
    .speak-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--slate); font-size: 13px; cursor: pointer; margin-top: 10px; }
    .speak-btn:hover { background: var(--mist); }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .breakdown-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .breakdown-table th { text-align: left; color: var(--slate); font-weight: 500; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
    .breakdown-table td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--mist); vertical-align: top; line-height: 1.5; }
    .breakdown-table tr:last-child td { border-bottom: none; }
    .td-yours { color: var(--red); }
    .td-correct { color: var(--jade); font-family: var(--font-hanzi); font-size: 14px; }
    .td-reason { color: var(--slate); }
    .success-note { font-size: 13px; color: var(--jade); margin-top: 12px; }
    .alt-box { margin-top: 12px; padding: 10px 14px; background: var(--mist); border-radius: 6px; font-size: 13px; color: var(--slate); line-height: 1.6; }

    .history-section { margin-top: 32px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--mist); cursor: pointer; font-size: 14px; border-radius: 6px; }
    .history-item:hover { background: var(--mist); }
    .history-orig { color: var(--slate); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-hanzi { font-family: var(--font-hanzi); font-size: 13px; color: var(--jade); }
    .footer { text-align: center; padding: 32px 0 16px; font-size: 11px; color: var(--border); }
    @media (max-width: 480px) { .score-rings { gap: 12px; } .result-hanzi { font-size: 22px; } }
  </style>
</head>
<body>
<div class="app" id="root"></div>
<script>
// ── CONFIG ─────────────────────────────────────────────────────
const ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';

// Model configs for each provider
const PROVIDER_MODELS = {
  'openrouter': {
    name: 'OpenRouter Free (Recommended)',
    description: '',
    models: [
      'nvidia/nemotron-3-ultra-550b-a55b:free',
      'meta-llama/llama-3.1-405b-instruct:free',
      'openrouter/auto',
      'google/gemma-4-31b-it:free',
      'openai/gpt-oss-20b:free',
    ],
    note: 'Free tier: 50 req/day. Add $5 credit for 1,000 req/day. <a href="https://openrouter.ai/keys" target="_blank">Get free key →</a>'
  },
  'openai': {
    name: 'OpenAI GPT (BYOK)',
    description: 'Use your own OpenAI key via OpenRouter',
    models: [
      'openai/gpt-4o',
      'openai/gpt-4-turbo',
      'openai/gpt-4',
      'openai/gpt-3.5-turbo',
    ],
    note: '<strong>Setup:</strong> 1. Add OpenAI key to <a href="https://openrouter.ai/settings/byok/openai" target="_blank">OpenRouter BYOK</a> 2. Enter OpenRouter key in app 3. Done!'
  },
  'claude': {
    name: 'Anthropic Claude (BYOK)',
    description: 'Use your own Claude key via OpenRouter',
    models: [
      'anthropic/claude-3-opus',
      'anthropic/claude-3-sonnet',
      'anthropic/claude-3-haiku',
    ],
    note: '<strong>Setup:</strong> 1. Add Claude key to <a href="https://openrouter.ai/settings/byok/anthropic" target="_blank">OpenRouter BYOK</a> 2. Enter OpenRouter key in app 3. Done!'
  },
  'deepseek': {
    name: 'DeepSeek (BYOK)',
    description: 'Use your own DeepSeek key via OpenRouter',
    models: [
      'deepseek/deepseek-v4-flash-0731',
      'deepseek/deepseek-r1-0528',
      'deepseek/deepseek-chat-v3-0324',
    ],
    note: '<strong>Setup:</strong> 1. Add DeepSeek key to <a href="https://openrouter.ai/settings/byok/deepseek" target="_blank">OpenRouter BYOK</a> 2. Enter OpenRouter key in app 3. Done!'
  }
};

// ── STATE ──────────────────────────────────────────────────────
let state = {
  provider:  localStorage.getItem('manda_provider') || 'openrouter',
  apiKey:    localStorage.getItem('manda_key') || '',
  keySaved:  !!localStorage.getItem('manda_key'),
  mode:      'en',
  tab:       'type',
  textInput: '',
  micText:   '',
  recording: false,
  micErr:    '',
  loading:   false,
  result:    null,
  error:     '',
  history:   JSON.parse(localStorage.getItem('manda_hist') || '[]'),
};
let recognition = null;

// ── HELPERS ────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function getInput() {
  return state.tab === 'type' ? state.textInput.trim() : state.micText.trim();
}
function setMode(m) { state.mode = m; render(); }
function setTab(t)  { state.tab = t; render(); }
function setProvider(p) { state.provider = p; localStorage.setItem('manda_provider', p); render(); }
function showHistory(i) { state.result = state.history[i]; render(); }

function saveKey() {
  var v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  state.apiKey = v;
  state.keySaved = true;
  localStorage.setItem('manda_key', v);
  render();
}
function clearKey() {
  state.apiKey = '';
  state.keySaved = false;
  localStorage.removeItem('manda_key');
  render();
}

// ── MIC ────────────────────────────────────────────────────────
function toggleMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { state.micErr = 'Use Chrome or Edge for mic support'; render(); return; }
  state.recording ? stopMic() : startMic();
}
function startMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = state.mode === 'en' ? 'en-US' : 'zh-CN';
  recognition.interimResults = true;
  recognition.onresult = function(e) {
    var t = '';
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    state.micText = t; render();
  };
  recognition.onerror = function(e) {
    var msgs = { 'not-allowed': 'Mic blocked - allow access in browser settings', 'no-speech': 'No speech detected - try again' };
    state.micErr = msgs[e.error] || 'Mic error: ' + e.error;
    state.recording = false; render();
  };
  recognition.onend = function() { state.recording = false; render(); };
  recognition.start();
  state.recording = true; state.micErr = ''; state.micText = '';
  render();
}
function stopMic() {
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  state.recording = false; render();
}
function speak(text) {
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN'; utt.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

// ── API ────────────────────────────────────────────────────────
async function runCorrection() {
  var input = getInput();
  if (!input || !state.keySaved) return;
  state.loading = true; state.error = ''; state.result = null;
  render();

  var models = PROVIDER_MODELS[state.provider].models;

  var systemPrompt = 'You are Manda, a Mandarin correction engine for HSK 1-5 learners.\n\n' +
    (state.mode === 'en'
      ? 'Input mode: English to Mandarin\n\n' +
        'STEPS:\n' +
        '1. Score the English input for grammar, vocabulary, structure (0-10)\n' +
        '2. Correct any English errors and provide corrected English\n' +
        '3. Translate corrected English into natural Mandarin Chinese\n' +
        '4. Provide TWO separate breakdowns:\n' +
        '   - english_breakdown: errors found in the English input (grammar, spelling, punctuation, word choice)\n' +
        '   - mandarin_breakdown: notes on the Mandarin translation (tones, measure words, structure, word order)\n\n'
      : 'Input mode: Mandarin correction - fix tones, grammar, measure words, word order, characters\n\n') +
    'HSK scope reference:\n' +
    'HSK 1-2: Basic SVO structure, negation with bu/mei, measure words, question particles\n' +
    'HSK 3: Ba sentences, bi comparisons, resultative complements, aspect particles le/guo/zhe\n' +
    'HSK 4: Complex ba/bei, conjunctions (suiran/danshi, zhiyao/jiu), potential complements, shi...de\n' +
    'HSK 5: Advanced grammar, chengyu (4-character idioms), formal written Chinese, complex clause structures\n\n' +
    'Respond ONLY with valid JSON, no markdown, no backticks:\n' +
    '{\n' +
    '  "original": "user input exactly",\n' +
    (state.mode === 'en'
      ? '  "corrected_english": "corrected English version",\n' +
        '  "english_breakdown": [{ "element": "what was checked", "yours": "what user wrote", "correct": "correct form", "reason": "why, max 10 words" }],\n' +
        '  "mandarin_breakdown": [{ "element": "Mandarin element", "yours": "N/A", "correct": "correct Mandarin form", "reason": "translation note, max 10 words" }],\n'
      : '  "breakdown": [{ "element": "what checked", "yours": "what they had", "correct": "correct form", "reason": "why max 12 words" }],\n') +
    '  "corrected_hanzi": "correct Hanzi with spaces between word groups",\n' +
    '  "corrected_pinyin": "pinyin with tone marks spaced by word",\n' +
    '  "hsk_level": "HSK level of the Mandarin sentence e.g. HSK 3",\n' +
    '  "is_correct": true or false,\n' +
    '  "scores": { "grammar": 0-10, "tones": 0-10, "vocabulary": 0-10, "structure": 0-10 },\n' +
    '  "what_you_got_right": "encouraging note or empty string",\n' +
    '  "natural_alt": "more natural Mandarin phrasing or empty string"\n' +
    '}\n\n' +
    'Stay within HSK 1-5 vocabulary. Be concise.';

  try {
    var res = null;
    var lastError = 'All models failed - please try again';
    for (var mi = 0; mi < models.length; mi++) {
      var currentModel = models[mi];
      try {
        res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + state.apiKey,
          },
          body: JSON.stringify({
            model: currentModel,
            max_tokens: 4000,
            temperature: 0.2,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: input },
            ],
          }),
        });
      } catch(fetchErr) {
        lastError = 'Network error - check connection';
        continue;
      }
      if (res.status === 401) throw new Error('Invalid API key - check at openrouter.ai/keys');
      if (res.status === 429) { lastError = 'Rate limit - try again in a minute'; continue; }
      if (!res.ok) {
        var errData = await res.json().catch(function() { return {}; });
        lastError = (errData.error && errData.error.message) || 'Model unavailable, trying next...';
        res = null; continue;
      }
      break;
    }
    if (!res || !res.ok) throw new Error(lastError);

    var data = await res.json();
    var raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    var clean = raw.replace(/```json/gi, '').replace(/```/g, '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
    var jsonStart = clean.indexOf('{');
    var jsonEnd = clean.lastIndexOf('}');
    if (jsonStart === -1 || jsonEnd === -1) throw new Error('Model did not return valid JSON - try again');
    var jsonStr = clean.slice(jsonStart, jsonEnd + 1);
    var parsed = JSON.parse(jsonStr);
    state.result = parsed;
    state.history = [parsed].concat(state.history).slice(0, 20);
    localStorage.setItem('manda_hist', JSON.stringify(state.history));

  } catch(err) {
    state.error = err.message || 'Something went wrong - please try again';
  } finally {
    state.loading = false;
    render();
  }
}

// ── RENDER HELPERS ─────────────────────────────────────────────
function renderRing(score, label, color) {
  var R = 28, C = 2 * Math.PI * R;
  var offset = C * (1 - Math.max(0, Math.min(10, score)) / 10);
  return '<div class="ring-wrap">' +
    '<svg width="68" height="68" viewBox="0 0 68 68">' +
    '<circle cx="34" cy="34" r="' + R + '" fill="none" stroke="var(--mist)" stroke-width="5"/>' +
    '<circle cx="34" cy="34" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round"' +
    ' stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"' +
    ' transform="rotate(-90 34 34)" style="transition:stroke-dashoffset 0.7s"/>' +
    '<text x="34" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)">' + score + '</text>' +
    '</svg>' +
    '<div class="ring-label">' + label + '</div></div>';
}

function makeBreakdownTable(rows, isMandarinCol) {
  if (!rows || rows.length === 0) return '';
  var rowsHtml = rows.map(function(b) {
    return '<tr>' +
      '<td>' + esc(b.element) + '</td>' +
      '<td class="td-yours">' + esc(b.yours || '-') + '</td>' +
      '<td class="' + (isMandarinCol ? 'td-correct' : '') + '" style="color:var(--jade)">' + esc(b.correct) + '</td>' +
      '<td class="td-reason">' + esc(b.reason) + '</td>' +
      '</tr>';
  }).join('');
  return '<table class="breakdown-table"><thead><tr><th>Element</th><th>Yours</th><th>Correct</th><th>Why</th></tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody></table>';
}

function renderResult(r) {
  var sc = r.scores;
  var overall = sc ? Math.round(((sc.grammar + sc.tones + sc.vocabulary + sc.structure) / 4) * 10) / 10 : null;
  var gc = overall === null ? 'var(--jade)' : overall >= 8 ? 'var(--jade)' : overall >= 5 ? '#d97706' : 'var(--red)';

  var scoreBlock = sc ? (
    '<div class="score-card">' +
    '<div>' +
    '<span class="score-overall" style="color:' + gc + '">' + overall + '</span>' +
    '<span style="font-size:14px;color:var(--slate)">/10</span>' +
    (r.hsk_level ? ' <span class="badge badge-blue">' + esc(r.hsk_level) + '</span>' : '') +
    '</div>' +
    '<div class="score-rings">' +
    renderRing(sc.grammar, 'Grammar', '#5b8def') +
    renderRing(sc.tones, 'Tones', 'var(--red)') +
    renderRing(sc.vocabulary, 'Vocab', 'var(--jade)') +
    renderRing(sc.structure, 'Structure', '#d97706') +
    '</div></div>'
  ) : '';

  // English-to-Mandarin mode: two breakdown tables
  var breakdownBlock = '';
  if (r.english_breakdown || r.mandarin_breakdown) {
    breakdownBlock = '<div class="divider"></div>' +
      (r.english_breakdown && r.english_breakdown.length > 0
        ? '<div style="margin-bottom:16px">' +
          '<div class="result-label" style="color:#5b8def">English Breakdown</div>' +
          makeBreakdownTable(r.english_breakdown, false) +
          '</div>'
        : '') +
      (r.mandarin_breakdown && r.mandarin_breakdown.length > 0
        ? '<div style="margin-bottom:4px">' +
          '<div class="result-label" style="color:var(--jade)">Mandarin Breakdown</div>' +
          makeBreakdownTable(r.mandarin_breakdown, true) +
          '</div>'
        : '');
  } else if (r.breakdown && r.breakdown.length > 0) {
    // Mandarin correction mode: single breakdown table
    breakdownBlock = '<div class="divider"></div><div>' +
      '<div class="result-label">Breakdown</div>' +
      makeBreakdownTable(r.breakdown, true) +
      '</div>';
  }

  return '<div class="result-card">' + scoreBlock +
    '<div style="margin-bottom:16px">' +
    '<div class="result-label">What you said</div>' +
    '<div style="font-size:15px;color:var(--slate)">' + esc(r.original) + '</div>' +
    '</div>' +
    (r.corrected_english ?
      '<div class="divider"></div>' +
      '<div style="margin-bottom:16px">' +
      '<div class="result-label">Corrected English</div>' +
      '<div style="font-size:15px;color:var(--jade);font-weight:500">' + esc(r.corrected_english) + '</div>' +
      '</div>' : '') +
    '<div class="divider"></div>' +
    '<div style="margin-bottom:16px">' +
    '<div class="result-label">' + (r.is_correct && !r.corrected_english ? 'Correct' : 'Corrected Mandarin') + '</div>' +
    '<div class="result-hanzi">' + esc(r.corrected_hanzi) + '</div>' +
    '<div class="result-pinyin">' + esc(r.corrected_pinyin) + '</div>' +
    '<button class="speak-btn" onclick=\'speak(' + JSON.stringify(r.corrected_hanzi) + ')\'>&#128266; Play pronunciation</button>' +
    '</div>' +
    breakdownBlock +
    (r.what_you_got_right ? '<div class="success-note">&#10003; ' + esc(r.what_you_got_right) + '</div>' : '') +
    (r.natural_alt ? '<div class="alt-box"><strong>More natural:</strong> <span style="font-family:var(--font-hanzi)">' + esc(r.natural_alt) + '</span></div>' : '') +
    '</div>';
}

// ── MAIN RENDER ────────────────────────────────────────────────
function render() {
  var s = state;
  var prov = PROVIDER_MODELS[s.provider];
  var inp = getInput();
  var canGo = !s.loading && inp && s.keySaved;

  var inputBlock = s.tab === 'type'
    ? '<textarea id="mainInput" placeholder="' +
      (s.mode === 'en' ? 'Type what you want to say in English...' : 'Type your Mandarin sentence here...') +
      '" oninput="state.textInput=this.value">' + esc(s.textInput) + '</textarea>'
    : '<div class="mic-area">' +
      '<button class="mic-btn ' + (s.recording ? 'recording' : '') + '" onclick="toggleMic()">' +
      (s.recording ? '&#9209;' : '&#127908;') + '</button>' +
      '<div class="mic-status ' + (s.micErr ? 'err' : '') + '">' +
      esc(s.micErr || (s.recording ? 'Listening...' : s.micText ? 'Done - tap to re-record' : 'Tap to speak')) +
      '</div></div>' +
      '<textarea id="micInput" placeholder="Spoken text appears here - or type directly..." oninput="state.micText=this.value">' +
      esc(s.micText) + '</textarea>';

  var historyBlock = s.history.length > 0
    ? '<div class="history-section"><span class="label">Recent corrections</span>' +
      s.history.slice(0, 5).map(function(h, i) {
        return '<div class="history-item" onclick="showHistory(' + i + ')">' +
          '<span class="history-orig">' + esc(h.original) + '</span>' +
          '<span class="history-hanzi">' + esc(h.corrected_hanzi) + '</span></div>';
      }).join('') + '</div>'
    : '';

  document.getElementById('root').innerHTML =
    '<div class="hero">' +
    '<h1>Manda<span class="zh">&#32048;&#27491;</span></h1>' +
    '<p>Mandarin correction engine ' +
    '<span class="badge">HSK 1-5</span>' +
    '<span class="badge badge-blue">Multi-Provider</span>' +
    '<span class="badge badge-green">v0.2</span>' +
    '</p></div>' +

    '<div class="config-box">' +
    '<div class="config-section">' +
    '<label class="config-label">AI Provider</label>' +
    '<select onchange="setProvider(this.value)">' +
    Object.keys(PROVIDER_MODELS).map(function(key) {
      var p = PROVIDER_MODELS[key];
      return '<option value="' + key + '" ' + (s.provider === key ? 'selected' : '') + '>' + p.name + '</option>';
    }).join('') +
    '</select>' +
    '<div class="provider-note">' + prov.note + '</div>' +
    '</div>' +

    '<div class="config-section">' +
    '<div class="key-box-header">' +
    '<span class="key-box-title">&#128273; API Key (' + prov.name + ')</span>' +
    (s.keySaved ? '<span class="key-saved-chip">&#10003; Connected</span>' : '') +
    '</div>' +
    '<div class="key-row">' +
    '<input type="password" id="keyInput" value="' + esc(s.apiKey) + '" placeholder="sk-or-..." onkeydown="if(event.key===\'Enter\')saveKey()"/>' +
    '<button class="' + (s.keySaved ? 'saved' : '') + '" onclick="saveKey()">' + (s.keySaved ? '&#10003; Saved' : 'Save') + '</button>' +
    (s.keySaved ? '<button class="clear-btn" onclick="clearKey()">Clear</button>' : '') +
    '</div>' +
    '</div>' +
    '</div>' +

    '<div class="section"><span class="label">Mode</span>' +
    '<div class="toggle-row">' +
    '<button class="toggle-btn ' + (s.mode === 'en' ? 'active' : '') + '" onclick="setMode(\'en\')">English to Mandarin</button>' +
    '<button class="toggle-btn ' + (s.mode === 'zh' ? 'active' : '') + '" onclick="setMode(\'zh\')">Correct my Mandarin</button>' +
    '</div></div>' +

    '<div class="section">' +
    '<div class="tab-row">' +
    '<button class="tab-btn ' + (s.tab === 'type' ? 'active' : '') + '" onclick="setTab(\'type\')">&#9000; Type</button>' +
    '<button class="tab-btn ' + (s.tab === 'mic' ? 'active' : '') + '" onclick="setTab(\'mic\')">&#127908; Speak</button>' +
    '</div>' + inputBlock + '</div>' +

    '<button class="correct-btn" onclick="runCorrection()" ' + (canGo ? '' : 'disabled') + '>' +
    (s.loading ? 'Analyzing...' : !s.keySaved ? 'Enter your API key first' : 'Correct it') +
    '</button>' +

    (s.error ? '<div class="error-msg">' + esc(s.error) + '</div>' : '') +
    (s.loading ? '<div class="loading-box">Checking tones, grammar, and word choice... (this may take a moment for longer text)</div>' : '') +
    (s.result ? renderResult(s.result) : '') +
    historyBlock +
    '<div class="footer">Manda v0.2 - HSK 1-5 - Multi-provider support - Powered by open-source AI</div>';
}

render();
</script>
</body>
</html>
